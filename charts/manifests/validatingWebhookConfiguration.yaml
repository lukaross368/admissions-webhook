apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: pod-admissions-webhook-validate
webhooks:
  - name: validate.admissions-webhook.lukaross368.io
    clientConfig:
      service:
        name: webhook
        namespace: admissions-webhook
        path: /validate-pods
        port: 443
      caBundle: <add base64 encoded cert>
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: "Namespaced"
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 10
    failurePolicy: Fail
