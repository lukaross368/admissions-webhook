apiVersion: v1
kind: Pod
metadata:
  name: test-pod
  namespace: admissions-webhook
spec:
  containers:
    - name: busybox
      image: busybox
      command: ["sleep", "3600"]
      livenessProbe:
        exec:
          command: ["echo"]
        initialDelaySeconds: 1
        periodSeconds: 5
      readinessProbe:
        exec:
          command: ["echo"]
        initialDelaySeconds: 1
        periodSeconds: 5