name: CD - Admission Webhook
on: 
  push:
    branches:
      - main
jobs:
  cd-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo Code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0 

      - name: Create New Minor Release Tag
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          
          VERSION_NUM=${LATEST_TAG:1}
          MAJOR=$(echo $VERSION_NUM | awk -F. '{print $1}')
          MINOR=$(echo $VERSION_NUM | awk -F. '{print $2}')
          
          NEW_MINOR=$((MINOR + 1))
          NEW_TAG="v$MAJOR.$NEW_MINOR.0"
          
          echo "Current Tag: $LATEST_TAG"
          echo "New Tag: $NEW_TAG"
          
          gh release create "$NEW_TAG" \
            --title "$NEW_TAG Release" \
            --generate-notes \
            --target "$GITHUB_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Docker Login
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Extract GoReleaser Tag (for Docker)
        id: extract_tag
        run: echo "TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          push: true
          tags: |
            lukaross368/admissions-webhook:${{ steps.extract_tag.outputs.TAG }}
            lukaross368/admissions-webhook:latest
          file: Dockerfile

      - name: Verify Pull Image
        run: |
          docker pull lukaross368/admissions-webhook:${{ steps.extract_tag.outputs.TAG }}
          docker pull lukaross368/admissions-webhook:latest